# Guards the commit convention master's history is kept to. This runs for every pull
# request, documentation-only ones included: the E2E workflow is path filtered, and a
# squash merge of a single-commit pull request takes its subject from that commit's
# title, so this job is the only place the convention is checked before it lands.
#
# There is deliberately no build job here. On this project `mvn verify` computes exactly
# what the E2E workflow's build step does: the only plugin bound to the verify phase is
# maven-gpg-plugin and CI passes -Dgpg.skip=true, no module carries test sources, and
# spotbugs is version-pinned in the root pom without an execution, so none of its goals
# is ever bound. A build that breaks fails the E2E build step in about the time a
# standalone job used to take, before it starts any database container.

name: Commit Lint

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  commit-message-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages in PR
        run: |
          # Do not add a `git fetch --depth=1` of the base branch here: it marks
          # origin/<base> shallow, and once master moves past the PR branch the
          # base ref stops being an ancestor of HEAD, so the range below degenerates
          # to nearly the whole repository history and the job fails on commits that
          # are already on master. actions/checkout (fetch-depth: 0) already has it.
          #
          # A manual run carries no base_ref, and the empty value makes the range
          # below `origin/..HEAD`, which git rejects as an ambiguous argument.
          base="origin/${{ github.base_ref || 'master' }}"
          commits=$(git rev-list --no-merges "$base"..HEAD)
          if [[ -z "$commits" ]]; then
            echo "no non-merge commits to lint"
            exit 0
          fi

          for sha in $commits; do
            echo "linting commit: $sha"
            git log -1 --pretty=%B "$sha" > /tmp/commit-msg.txt
            ./.github/scripts/lint-commit-msg.sh /tmp/commit-msg.txt
          done
